<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live mobile checks</title><style>body{font-family:sans-serif;background:#e9e7e4;display:grid;justify-content:center;margin:0;padding:12px}iframe{border:0;background:white}p{font-size:12px}</style></head><body><p data-testid="review-status">Loading</p><iframe title="Live mobile workspace"></iframe><script>const q=new URLSearchParams(location.search),f=document.querySelector('iframe');f.width=q.get('width')||390;f.height=844;f.src=q.get('route')||'/';setInterval(()=>{const d=f.contentDocument;if(!d?.querySelector('h1,h2')||d.querySelector('.cn-route-loading'))return;document.querySelector('p').textContent='Ready · '+f.contentWindow.location.pathname+' · '+f.width+'px · overflow: '+(d.documentElement.scrollWidth>f.clientWidth);},200);</script></body></html>
